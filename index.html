<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kéfi">
<meta name="theme-color" content="#15101E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Kéfi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Roboto+Condensed:wght@700;900&display=swap">
<style>
/* Layout: phone prototype on the left, decision notes stacked beside it; one column under 900px */
:root{
  --ink:#0B0711;
  --panel:#15101E;
  --panel-2:#1E1729;
  --line:#2E2440;
  --fg:#F3EEF8;
  --muted:#A596B8;
  --hot:#FF2E88;
  --ember:#FF8A3D;
  --mint:#3DDC97;
  --display:"Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(255,46,136,.18), transparent 60%),
    radial-gradient(700px 500px at 95% 5%, rgba(255,138,61,.12), transparent 60%),
    var(--ink);
  color:var(--fg);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:760px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:36px 64px;
}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,52px);font-weight:900;line-height:.98;text-transform:uppercase}
h2{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--hot)}
.lede{color:var(--muted);max-width:60ch;margin-top:14px}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:34px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--display);font-size:30px;font-weight:900;letter-spacing:.02em}
.logo span{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

.stage{display:flex;justify-content:center}
.hint{font-size:13px;color:var(--hot);font-weight:700;margin-top:10px}
header.top{align-items:center;text-align:center}
header.top .lede{margin-inline:auto}
@media(max-width:900px){.stage{grid-template-columns:1fr;gap:32px}}

/* ---------- phone ---------- */
.phonecol{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
@media(max-width:900px){.phonecol{position:static}}
.modeswitch{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.modeswitch button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;border-radius:999px;cursor:pointer}
.modeswitch button[aria-pressed="true"]{background:linear-gradient(100deg,var(--hot),var(--ember));color:#1A0711}
.phone{
  width:100%;max-width:340px;aspect-ratio:9/18.6;max-height:720px;
  background:#07050B;border:1px solid var(--line);border-radius:38px;
  box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 0 0 7px #120D1A;
  padding:10px;position:relative;overflow:hidden;
}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:20px;background:#07050B;border-radius:999px;z-index:5}
.screen{height:100%;border-radius:30px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;padding:12px 18px 4px;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.nav{display:flex;align-items:center;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(11,7,17,.9);backdrop-filter:blur(8px)}
.nav button{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 6px;border-radius:10px}
.nav button[aria-current="true"]{color:var(--hot)}
.nav .ic{font-size:15px;line-height:1}
.nav .fab{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,var(--hot),var(--ember));color:#1A0711;display:grid;place-items:center;font-size:22px;font-weight:800;margin-top:-14px;box-shadow:0 6px 18px rgba(255,46,136,.4)}

.pad{padding:14px 16px}
.apphead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.apphead b{font-family:var(--display);font-size:22px;font-weight:900}
.chips{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel-2);cursor:pointer}
.chip.on{background:linear-gradient(100deg,var(--hot),var(--ember));color:#1A0711;border-color:transparent}

.post{position:relative;margin:0 16px 14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end}
.post .art{position:absolute;inset:0}
.a1{background:radial-gradient(120px 90px at 25% 30%, rgba(255,138,61,.75), transparent 70%),radial-gradient(160px 120px at 80% 20%, rgba(255,46,136,.55), transparent 70%),linear-gradient(190deg,#3A1430,#120B1C)}
.a2{background:radial-gradient(140px 100px at 70% 35%, rgba(61,220,151,.45), transparent 70%),radial-gradient(180px 140px at 20% 70%, rgba(255,46,136,.4), transparent 70%),linear-gradient(200deg,#1B2440,#120B1C)}
.a3{background:radial-gradient(150px 110px at 40% 25%, rgba(255,214,102,.6), transparent 70%),linear-gradient(200deg,#40241A,#120B1C)}
.post .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,5,11,.92) 12%,rgba(7,5,11,0) 62%)}
.post .meta{position:relative;padding:14px}
.venuepill{display:inline-flex;align-items:center;gap:6px;background:rgba(7,5,11,.6);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.04em}
.post .cap{font-size:12px;margin-top:8px;color:#EADFF2}
.post .tags{font-size:11px;color:var(--hot);font-weight:700;margin-top:3px}
.rail{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:12px;align-items:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.rail div{display:flex;flex-direction:column;align-items:center;gap:2px}
.rail .g{font-size:17px}

/* map */
.map{position:relative;height:330px;margin:0 16px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0D0A14}
.map .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,100,160,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(124,100,160,.14) 1px,transparent 1px);background-size:38px 38px}
.map .road{position:absolute;background:rgba(124,100,160,.22)}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--hot);background:linear-gradient(150deg,#3A1430,#1A1026);display:grid;place-items:center;font-size:11px;cursor:pointer;transform:translate(-50%,-50%)}
.pin.hot{border-color:var(--ember);box-shadow:0 0 0 0 rgba(255,138,61,.5);animation:pulse 2.4s infinite}
.pin.sel{outline:2px solid #fff;outline-offset:2px}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,138,61,0)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}}
@media(prefers-reduced-motion:reduce){.pin.hot{animation:none}}
.me{position:absolute;width:12px;height:12px;border-radius:50%;background:#56A3FF;border:2px solid #fff;transform:translate(-50%,-50%)}
.sheet{margin:12px 16px 0;background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.heat{font-size:11px;font-weight:800;color:var(--ember)}

/* venue */
.cover{height:130px;background:radial-gradient(180px 120px at 30% 40%, rgba(255,138,61,.6), transparent 70%),linear-gradient(200deg,#45192F,#120B1C);position:relative}
.cover .back{position:absolute;top:10px;left:12px;background:rgba(7,5,11,.6);border:1px solid var(--line);border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:13px}
.verified{color:#56A3FF;font-size:12px}
.tabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--body);font-weight:800;font-size:12px;padding:8px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--hot)}
.offer{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.offer .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,46,136,.25),rgba(255,138,61,.25));font-size:16px}
.offer small{color:var(--muted);font-size:10px}
.cta{display:block;width:calc(100% - 32px);margin:12px 16px;border:0;border-radius:999px;padding:13px;font-family:var(--body);font-weight:800;font-size:14px;color:#1A0711;background:linear-gradient(100deg,var(--hot),var(--ember));cursor:pointer}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

/* check-in */
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 20px}
.qr{width:150px;height:150px;background:#fff;border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(17,1fr);gap:0}
.qr i{background:transparent}
.qr i.on{background:#07050B}
.ring{width:160px;height:160px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .num{font-family:var(--display);font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.dual{position:relative;width:100%;height:230px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(140px 110px at 45% 45%, rgba(255,138,61,.5), transparent 70%),linear-gradient(200deg,#3A1430,#110A1A)}
.dual .selfie{position:absolute;top:10px;right:10px;width:66px;height:92px;border-radius:12px;border:2px solid #fff;background:radial-gradient(60px 60px at 50% 35%, rgba(255,214,180,.85), rgba(80,40,60,.9));}
.dual .t{position:absolute;top:10px;left:12px;font-size:11px;font-weight:800;background:rgba(7,5,11,.6);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.shutter{width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:linear-gradient(140deg,var(--hot),var(--ember));cursor:pointer}
.tick{width:92px;height:92px;border-radius:50%;background:linear-gradient(150deg,var(--hot),#8B3BFF);display:grid;place-items:center;font-size:40px;box-shadow:0 0 40px rgba(255,46,136,.5)}
.prize{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}

/* rewards */
.wallet{background:linear-gradient(130deg,rgba(255,46,136,.3),rgba(139,59,255,.3));border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wallet .big{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
.use{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:11px;color:#1A0711;background:linear-gradient(100deg,var(--hot),var(--ember));cursor:pointer;font-family:var(--body)}
.used{background:var(--panel);color:var(--muted);border:1px solid var(--line)}

/* business */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi small{font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .up{font-size:10px;color:var(--mint);font-weight:800}
.chartbox{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}

/* ---------- notes column ---------- */
.notes{display:flex;flex-direction:column;gap:22px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h2{margin-bottom:6px}
.card h2 + p{color:var(--muted)}
.verdict{border-left:3px solid var(--hot)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.box{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h3{font-size:14px;margin-bottom:4px}
.box p{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.tablewrap{overflow-x:auto}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;background:linear-gradient(140deg,var(--hot),var(--ember));color:#1A0711;font-size:14px}
ol.steps b{display:block;font-size:14px}
ol.steps span{font-size:13px;color:var(--muted)}
.flag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-bottom:10px}
.risk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border:0}
.risk b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 auto}
.d-red{background:#FF4D6D}.d-amb{background:var(--ember)}.d-grn{background:var(--mint)}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:40px}
.feats div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.feats p{font-size:13px;color:var(--muted);margin-top:4px}
@media(max-width:560px){.feats{grid-template-columns:1fr}}
footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* ---- standalone: full-screen app on phones ---- */
html,body{height:100%}
body{margin:0}
.app-shell{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.app-shell .phonecol{max-width:360px}
@media (max-width:600px){
  body{background:var(--panel)}
  .app-shell{padding:0;display:block;height:100%}
  .app-shell .phonecol{max-width:none;height:100%;gap:0}
  .phone{max-width:none;max-height:none;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;padding:0;background:var(--panel)}
  .notch,.statusbar{display:none}
  .screen{border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .modeswitch{position:fixed;z-index:20;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:auto;padding:3px;background:rgba(21,16,30,.9);backdrop-filter:blur(8px)}
  .modeswitch button{flex:0 0 auto;padding:6px 10px;font-size:10px}
  .apphead{padding-right:150px}
  .apphead > span{display:none}
  .map{height:52vh}
}
</style>
</head>
<body>
<div class="app-shell">
<div class="phonecol">
      <div class="modeswitch" role="group" aria-label="Πλευρά εφαρμογής">
        <button id="m-user" aria-pressed="true">Πελάτης</button>
        <button id="m-biz" aria-pressed="false">Μαγαζί</button>
      </div>

      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="statusbar"><span>21:41</span><span>5G &nbsp;100%</span></div>

          <div class="view" id="view"></div>

          <nav class="nav" id="nav">
            <button data-go="feed" aria-current="true"><span class="ic">◉</span>Feed</button>
            <button data-go="map"><span class="ic">◇</span>Χάρτης</button>
            <button data-go="scan" class="fabwrap"><span class="fab">+</span></button>
            <button data-go="rewards"><span class="ic">★</span>Rewards</button>
            <button data-go="profile"><span class="ic">◍</span>Προφίλ</button>
          </nav>
        </div>
      </div>
    </div>
</div>
<script>
(function(){
  var view=document.getElementById('view');
  var nav=document.getElementById('nav');
  var mUser=document.getElementById('m-user'), mBiz=document.getElementById('m-biz');
  var timer=null;

  function qr(){
    var cells='';
    for(var r=0;r<17;r++){
      for(var c=0;c<17;c++){
        var finder=(r<5&&c<5)||(r<5&&c>11)||(r>11&&c<5);
        var on;
        if(finder){
          var rr=r>11?16-r:r, cc=c>11?16-c:c;
          on=!(rr===1||cc===1)&&!(rr===3&&cc===3)?true:(rr===2&&cc===2);
          on=(rr===0||cc===0||rr===4||cc===4||(rr>=2&&rr<=2&&cc>=2&&cc<=2));
        } else {
          on=((r*7+c*13+((r*c)%5))%3===0);
        }
        cells+='<i class="'+(on?'on':'')+'"></i>';
      }
    }
    return cells;
  }

  var screens={
    feed:function(){return ''+
      '<div class="apphead"><b>Kéfi</b><span style="font-size:12px;color:var(--muted)">◌ Ηράκλειο</span></div>'+
      '<div class="chips"><span class="chip on">Για σένα</span><span class="chip">Κοντά σου</span><span class="chip">Trending</span><span class="chip">Ανοιχτά τώρα</span></div>'+
      '<div class="post"><div class="art a1"></div><div class="shade"></div>'+
        '<div class="rail"><div><span class="g">♥</span>1.2K</div><div><span class="g">◌</span>64</div><div><span class="g">↗</span>23</div></div>'+
        '<div class="meta"><span class="venuepill">◼ Levare Café · 0.3 km</span>'+
        '<p class="cap">@maria.k — Τέλειο vibe απόψε, γεμάτο μέχρι έξω</p><p class="tags">#kefimoment #heraklion</p></div></div>'+
      '<div class="post"><div class="art a2"></div><div class="shade"></div>'+
        '<div class="rail"><div><span class="g">♥</span>842</div><div><span class="g">◌</span>31</div><div><span class="g">↗</span>12</div></div>'+
        '<div class="meta"><span class="venuepill">◼ Aktaion Bar · 1.1 km</span>'+
        '<p class="cap">@nikos — 2 λεπτά πριν, ουρά στην μπάρα</p><p class="tags">#kefimoment #cocktails</p></div></div>'+
      '<div class="post"><div class="art a3"></div><div class="shade"></div>'+
        '<div class="meta"><span class="venuepill">◼ Brunch Lab · 2.4 km</span>'+
        '<p class="cap">@eleni — Ήσυχα, βρήκαμε τραπέζι αμέσως</p></div></div>';
    },
    map:function(){return ''+
      '<div class="apphead"><b>Χάρτης</b><span style="font-size:11px;color:var(--muted)">21:41 · Παρασκευή</span></div>'+
      '<div class="chips"><span class="chip on">Όλα</span><span class="chip">Bars</span><span class="chip">Cafés</span><span class="chip">Εστιατόρια</span><span class="chip">Clubs</span></div>'+
      '<div class="map">'+
        '<div class="grid"></div>'+
        '<div class="road" style="left:0;right:0;top:46%;height:3px"></div>'+
        '<div class="road" style="top:0;bottom:0;left:38%;width:3px"></div>'+
        '<div class="road" style="top:0;bottom:0;left:72%;width:2px"></div>'+
        '<div class="pin hot" data-v="Levare Café" data-h="Πολύς κόσμος · 12 στιγμές" style="left:30%;top:33%">◼</div>'+
        '<div class="pin hot" data-v="Aktaion Bar" data-h="Γεμίζει · 8 στιγμές" style="left:64%;top:24%">◼</div>'+
        '<div class="pin" data-v="Brunch Lab" data-h="Ήσυχα · 2 στιγμές" style="left:20%;top:68%">◼</div>'+
        '<div class="pin" data-v="Ocean Club" data-h="Ανοίγει 23:00" style="left:78%;top:62%">◼</div>'+
        '<div class="pin" data-v="Mezé 42" data-h="Μέτρια κίνηση · 4 στιγμές" style="left:48%;top:78%">◼</div>'+
        '<div class="me" style="left:46%;top:50%"></div>'+
      '</div>'+
      '<div class="sheet" id="sheet">'+
        '<div class="row"><div><h3 style="font-size:15px">Levare Café</h3><p class="heat" id="heat">Πολύς κόσμος · 12 στιγμές</p></div>'+
        '<button class="use" data-go="venue">Άνοιγμα</button></div>'+
        '<p style="font-size:12px;color:var(--muted);margin-top:8px">Η θερμότητα βγαίνει από check-ins των τελευταίων 90 λεπτών, όχι από κρατήσεις.</p>'+
      '</div><div style="height:16px"></div>';
    },
    venue:function(){return ''+
      '<div class="cover"><div class="back" data-go="map">‹</div></div>'+
      '<div class="pad" style="padding-bottom:0">'+
        '<h3 style="font-size:20px">Levare Café <span class="verified">✓</span></h3>'+
        '<p style="font-size:12px;color:var(--muted)">Bar · Ηράκλειο · 0.3 km</p>'+
        '<p style="font-size:12px;margin-top:6px">★ 4.8 (132) &nbsp;·&nbsp; <span class="heat">Πολύς κόσμος τώρα</span></p>'+
      '</div>'+
      '<div class="tabs"><button aria-selected="true">Live</button><button>Προσφορές</button><button>Πληροφορίες</button></div>'+
      '<div class="pad">'+
        '<div class="offer"><span class="em">◍</span><div><b style="font-size:13px">20% έκπτωση σε cocktails</b><br><small>Ισχύει έως 02:00 · 18 έμειναν</small></div></div>'+
        '<div class="offer"><span class="em">◆</span><div><b style="font-size:13px">1+1 ποτό πριν τις 23:00</b><br><small>Μόνο με check-in στο μαγαζί</small></div></div>'+
        '<p style="font-size:12px;color:var(--muted);margin-top:10px">14 στιγμές τις τελευταίες 2 ώρες από 11 άτομα.</p>'+
      '</div>'+
      '<button class="cta" data-go="scan">Check-in &amp; Κέρδισε</button><div style="height:8px"></div>';
    },
    scan:function(){return ''+
      '<div class="center">'+
        '<h3>Σκάναρε το QR</h3>'+
        '<p style="font-size:12px;color:var(--muted)">Το QR είναι στο τραπέζι ή στην μπάρα. Έτσι ξέρουμε ότι είσαι όντως μέσα.</p>'+
        '<div class="qr">'+qr()+'</div>'+
        '<button class="cta" style="width:100%;margin:8px 0 0" data-go="moment">Σκάναρα το QR</button>'+
        '<button class="cta ghost" style="width:100%;margin:0" data-go="feed">Άκυρο</button>'+
      '</div>';
    },
    moment:function(){return ''+
      '<div class="center">'+
        '<p class="eyebrow">Kéfi Moment</p>'+
        '<h3>Έχεις 2 λεπτά</h3>'+
        '<p style="font-size:12px;color:var(--muted);max-width:28ch">Διπλή κάμερα, μπροστά και πίσω. Όπως το BeReal, αλλά δένει με το μαγαζί που βρίσκεσαι.</p>'+
        '<div class="ring">'+
          '<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="#2E2440" stroke-width="7"></circle>'+
          '<circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="#FF2E88" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"></circle></svg>'+
          '<span class="num" id="clock">2:00</span>'+
        '</div>'+
        '<button class="cta" style="width:100%;margin:4px 0 0" data-go="camera">Ξεκίνα</button>'+
      '</div>';
    },
    camera:function(){return ''+
      '<div class="center">'+
        '<div class="dual"><span class="t" id="clock2">1:35</span><div class="selfie"></div></div>'+
        '<p style="font-size:12px;color:var(--muted)">Levare Café · Ηράκλειο</p>'+
        '<button class="shutter" data-go="won" aria-label="Τράβα φωτογραφία"></button>'+
        '<p style="font-size:11px;color:var(--muted)">Πάτα τον κύκλο</p>'+
      '</div>';
    },
    won:function(){return ''+
      '<div class="center" style="padding-top:34px">'+
        '<div class="tick">✓</div>'+
        '<h3>Η στιγμή σου ανέβηκε</h3>'+
        '<p style="font-size:12px;color:var(--muted)">Κέρδισες:</p>'+
        '<div class="prize"><span class="em" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,46,136,.25),rgba(255,138,61,.25))">◍</span>'+
        '<div><b style="font-size:13px">1 δωρεάν cocktail</b><br><small style="color:var(--muted);font-size:10px">Levare Café · ισχύει 48 ώρες</small></div></div>'+
        '<button class="cta" style="width:100%;margin:10px 0 0" data-go="rewards">Δες τα rewards σου</button>'+
        '<button class="cta ghost" style="width:100%;margin:0" data-go="feed">Πίσω στο feed</button>'+
      '</div>';
    },
    rewards:function(){return ''+
      '<div class="apphead"><b>Τα rewards μου</b></div>'+
      '<div class="pad" style="padding-top:0">'+
        '<div class="wallet"><div><p style="font-size:11px;color:var(--muted)">Διαθέσιμα τώρα</p><span class="big">3</span></div><span style="font-size:34px">◍</span></div>'+
        '<div class="offer"><span class="em">◍</span><div style="flex:1"><b style="font-size:13px">1 δωρεάν cocktail</b><br><small>Levare Café · λήγει σε 47 ώρες</small></div><button class="use">Χρήση</button></div>'+
        '<div class="offer"><span class="em">◆</span><div style="flex:1"><b style="font-size:13px">Δωρεάν επιδόρπιο</b><br><small>Brunch Lab · λήγει 05/11</small></div><button class="use">Χρήση</button></div>'+
        '<div class="offer"><span class="em">▲</span><div style="flex:1"><b style="font-size:13px">1+1 ποτό</b><br><small>Ocean Club · λήγει 10/11</small></div><button class="use">Χρήση</button></div>'+
        '<div class="offer" style="opacity:.5"><span class="em">✓</span><div style="flex:1"><b style="font-size:13px">20% σε cocktails</b><br><small>Χρησιμοποιήθηκε 12/10</small></div><button class="use used">Λήξη</button></div>'+
        '<p style="font-size:11px;color:var(--muted);margin-top:10px">Το μαγαζί το κλείνει σκανάροντας τον κωδικό σου. Έτσι μετράει το redemption.</p>'+
      '</div>';
    },
    profile:function(){return ''+
      '<div class="apphead"><b>Προφίλ</b><span style="font-size:12px;color:var(--muted)">⚙</span></div>'+
      '<div class="pad" style="padding-top:0">'+
        '<div style="display:flex;gap:12px;align-items:center">'+
          '<div style="width:56px;height:56px;border-radius:50%;background:radial-gradient(40px 40px at 50% 35%, rgba(255,214,180,.85), rgba(80,40,60,.9));border:2px solid var(--hot)"></div>'+
          '<div><b style="font-family:var(--display);font-size:19px">Μαρία</b><br><small style="color:var(--muted)">@maria.k · Gold Viber</small></div>'+
        '</div>'+
        '<div class="kpis" style="margin-top:14px"><div class="kpi"><b>128</b><small>Στιγμές</small></div><div class="kpi"><b>1.2K</b><small>Followers</small></div><div class="kpi"><b>4.8K</b><small>Πόντοι</small></div></div>'+
        '<div class="chartbox"><b style="font-size:13px">Μαγαζιά που επισκέφτηκες</b>'+
          '<p style="font-size:12px;color:var(--muted);margin-top:6px">Levare Café · 11 φορές<br>Aktaion Bar · 6 φορές<br>Brunch Lab · 4 φορές</p></div>'+
        '<p style="font-size:11px;color:var(--muted);margin-top:12px">Οι πόντοι ανεβάζουν επίπεδο και ξεκλειδώνουν καλύτερες προσφορές. Αυτό κρατάει τον κόσμο να ξαναέρχεται.</p>'+
      '</div>';
    },
    biz:function(){
      var pts=[18,26,22,34,30,48,41];
      var d='', w=250, h=70, max=50;
      for(var i=0;i<pts.length;i++){
        var x=(i/(pts.length-1))*w, y=h-(pts[i]/max)*h;
        d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
      }
      var days=['Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ','Κυρ'];
      return ''+
      '<div class="apphead"><b>Levare Café</b><span style="font-size:11px;color:var(--muted)">Αυτή η εβδομάδα</span></div>'+
      '<div class="pad" style="padding-top:0">'+
        '<div class="kpis"><div class="kpi"><b>1.248</b><small>Προβολές</small><span class="up">▲ 18%</span></div>'+
        '<div class="kpi"><b>342</b><small>Check-ins</small><span class="up">▲ 24%</span></div>'+
        '<div class="kpi"><b>128</b><small>Εξαργυρώσεις</small><span class="up">▲ 12%</span></div></div>'+
        '<div class="chartbox"><b style="font-size:13px">Check-ins ανά ημέρα</b>'+
          '<svg viewBox="0 0 250 92" style="width:100%;height:auto;margin-top:8px" role="img" aria-label="Check-ins ανά ημέρα, κορύφωση Σάββατο στα 48">'+
            '<line x1="0" y1="70" x2="250" y2="70" stroke="#2E2440" stroke-width="1"></line>'+
            '<line x1="0" y1="35" x2="250" y2="35" stroke="#2E2440" stroke-width="1" stroke-dasharray="3 4"></line>'+
            '<path d="'+d+'" fill="none" stroke="#FF2E88" stroke-width="2.5" stroke-linejoin="round"></path>'+
            '<circle cx="208.3" cy="2.8" r="4" fill="#FF8A3D"></circle>'+
            '<text x="196" y="88" fill="#A596B8" font-size="8" font-family="Manrope,sans-serif">Σαβ · 48</text>'+
            days.map(function(dy,i){return '<text x="'+((i/6)*w).toFixed(0)+'" y="82" fill="#A596B8" font-size="8" font-family="Manrope,sans-serif" text-anchor="'+(i===0?'start':i===6?'end':'middle')+'">'+dy+'</text>';}).join('')+
          '</svg>'+
        '</div>'+
        '<div class="chartbox"><b style="font-size:13px">Κόστος προσφοράς</b>'+
          '<p style="font-size:12px;color:var(--muted);margin-top:6px">128 εξαργυρώσεις × 3,20 € κόστος ποτού = <b style="color:var(--fg)">410 €</b> δωρεάν προϊόν.<br>Μέση απόδειξη επισκέπτη: 14 €. Τζίρος από Kéfi: <b style="color:var(--mint)">~1.790 €</b>.</p></div>'+
        '<p style="font-size:11px;color:var(--muted);margin-top:12px">Ο ιδιοκτήτης βλέπει πόσος κόσμος ήρθε από το Kéfi, πόσες προσφορές εξαργυρώθηκαν και τι του απέφεραν.</p>'+
      '</div>';
    }
  };

  function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }

  function runTimer(){
    var total=120, left=120;
    var clock=document.getElementById('clock'), arc=document.getElementById('arc');
    if(!clock) return;
    timer=setInterval(function(){
      left--;
      if(left<0){stopTimer();return;}
      var m=Math.floor(left/60), s=left%60;
      clock.textContent=m+':'+(s<10?'0':'')+s;
      if(arc) arc.setAttribute('stroke-dashoffset', (339.3*(1-left/total)).toFixed(1));
    },1000);
  }

  function go(name){
    stopTimer();
    view.innerHTML=screens[name]();
    view.scrollTop=0;
    if(name==='moment') runTimer();
    var navMap={feed:'feed',map:'map',venue:'map',scan:'scan',moment:'scan',camera:'scan',won:'scan',rewards:'rewards',profile:'profile'};
    Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){
      b.setAttribute('aria-current', b.dataset.go===navMap[name] ? 'true':'false');
    });
  }

  view.addEventListener('click',function(e){
    var t=e.target.closest('[data-go]');
    if(t){ go(t.dataset.go); return; }
    var pin=e.target.closest('.pin');
    if(pin){
      Array.prototype.forEach.call(view.querySelectorAll('.pin'),function(p){p.classList.remove('sel');});
      pin.classList.add('sel');
      var sheet=document.getElementById('sheet');
      if(sheet){ sheet.querySelector('h3').textContent=pin.dataset.v; document.getElementById('heat').textContent=pin.dataset.h; }
      return;
    }
    var chip=e.target.closest('.chip');
    if(chip){ Array.prototype.forEach.call(chip.parentNode.children,function(c){c.classList.remove('on');}); chip.classList.add('on'); return; }
    var tab=e.target.closest('.tabs button');
    if(tab){ Array.prototype.forEach.call(tab.parentNode.children,function(c){c.setAttribute('aria-selected','false');}); tab.setAttribute('aria-selected','true'); return; }
    var use=e.target.closest('.use:not(.used):not([data-go])');
    if(use){ use.textContent='Σκανάρισμα'; use.classList.add('used'); }
  });

  nav.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    mUser.setAttribute('aria-pressed','true'); mBiz.setAttribute('aria-pressed','false');
    nav.hidden=false; go(b.dataset.go);
  });

  mUser.addEventListener('click',function(){
    mUser.setAttribute('aria-pressed','true'); mBiz.setAttribute('aria-pressed','false');
    nav.hidden=false; go('feed');
  });
  mBiz.addEventListener('click',function(){
    mBiz.setAttribute('aria-pressed','true'); mUser.setAttribute('aria-pressed','false');
    stopTimer(); nav.hidden=true; view.innerHTML=screens.biz(); view.scrollTop=0;
  });

  go('feed');
})();
</script>
</body>
</html>
